<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Analytics</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- Data (generated by parse_gpx.py) -->
<script src="activities.js"></script>
<!-- Cycling power data (generated by fetch_cycling_power.py) -->
<script src="cycling_activities.js"></script>
<!-- Cycling cadence (generated by backfill_cadence.py) -->
<script src="cadence_activities.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --accent:   #4f8ef7;
    --accent2:  #f74f8e;
    --green:    #4fbd87;
    --yellow:   #f7c94f;
    --text:     #e2e4ed;
    --muted:    #6b7080;
    --radius:   10px;
  }

  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Layout ── */
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.3px; }
  header span { color: var(--muted); font-size: .85rem; }

  main { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto auto 1fr; gap: 18px; padding: 20px 28px; }

  /* ── Cards ── */
  .cards { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 22px; flex: 1; min-width: 150px;
  }
  .card .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .card .value { font-size: 1.7rem; font-weight: 700; line-height: 1; }
  .card .sub   { color: var(--muted); font-size: .78rem; margin-top: 6px; }

  /* ── Charts row ── */
  .charts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .chart-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; height: 240px; display: flex; flex-direction: column;
  }
  .chart-box h3 { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .chart-box canvas { flex: 1; min-height: 0; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .chart-header h3 { margin-bottom: 0; }
  .toggle-group { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .toggle-btn { background: none; border: none; color: var(--muted); font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: background .15s, color .15s; }
  .toggle-btn.active { background: var(--accent); color: #fff; }
  .chart-controls { display: flex; align-items: center; gap: 6px; }
  .chart-controls select { background: var(--bg); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 6px; font-size: .72rem; outline: none; cursor: pointer; }
  .chart-controls select:focus { border-color: var(--accent); }
  .chart-controls .sep { color: var(--border); font-size: .8rem; }

  /* ── Table panel ── */
  .table-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; overflow: hidden; max-height: 620px;
  }
  .table-toolbar {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .table-toolbar input, .table-toolbar select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: .82rem; outline: none;
  }
  .table-toolbar input { flex: 1; min-width: 140px; }
  .table-toolbar input:focus, .table-toolbar select:focus { border-color: var(--accent); }

  .table-wrap { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  thead th {
    position: sticky; top: 0; background: var(--surface);
    padding: 10px 12px; text-align: left; color: var(--muted);
    text-transform: uppercase; font-size: .72rem; letter-spacing: .06em;
    cursor: pointer; white-space: nowrap; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
  tbody tr:hover { background: rgba(79,142,247,.07); }
  tbody tr.selected { background: rgba(79,142,247,.14); }
  tbody td { padding: 9px 12px; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: .7rem; font-weight: 600; background: rgba(79,142,247,.15); color: var(--accent);
  }
  .badge.run    { background: rgba(79,189,135,.15); color: var(--green); }
  .badge.bike   { background: rgba(247,201,79,.15);  color: var(--yellow); }
  .badge.swim   { background: rgba(79,142,247,.15);  color: var(--accent); }
  .badge.trail  { background: rgba(189,135,79,.15);  color: #f7a44f; }
  .badge.hike   { background: rgba(135,189,79,.15);  color: #a4f74f; }
  .badge.other  { background: rgba(107,112,128,.15); color: var(--muted); }

  /* ── Map panel ── */
  .map-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .map-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: .82rem; }
  .map-header strong { display: block; font-size: .9rem; margin-bottom: 2px; }
  .map-header .meta { color: var(--muted); font-size: .78rem; }
  #map { flex: 1; min-height: 300px; }
  .map-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--border);
  }
  .power-profile-strip { grid-template-columns: repeat(5, 1fr); background: rgba(79,142,247,.04); }
  .map-stat { padding: 10px 12px; border-right: 1px solid var(--border); }
  .map-stat:last-child { border-right: none; }
  .map-stat .s-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .map-stat .s-value { font-size: 1rem; font-weight: 600; margin-top: 3px; }

  /* ── Empty state ── */
  .empty { padding: 60px; text-align: center; color: var(--muted); }
  .empty strong { display: block; font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
  code { background: var(--border); padding: 2px 6px; border-radius: 4px; font-size: .85em; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
  <h1>Sports Analytics</h1>
  <span id="header-sub">Loading…</span>
  <nav style="margin-left:auto;display:flex;gap:6px;">
    <a href="index.html" style="color:var(--accent);text-decoration:none;font-size:.85rem;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;">Activities</a>
    <a href="self.html" style="color:var(--muted);text-decoration:none;font-size:.85rem;padding:6px 12px;border:1px solid var(--border);border-radius:6px;">Understanding Myself</a>
  </nav>
</header>

<!-- Cycling power & HR trend (top, full width) -->
<section style="padding: 20px 28px 0;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column;">
    <div class="chart-header" style="margin-bottom: 10px;">
      <h3 style="font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;">Cycling — Avg power &amp; HR over time</h3>
      <span id="cycling-stats" style="color:var(--muted); font-size:.72rem;"></span>
    </div>
    <div id="cy-range-wrap" style="display:flex; align-items:center; gap:12px; padding:4px 0 12px; font-size:.72rem; color:var(--muted);">
      <span id="cy-range-label" style="min-width:170px; font-variant-numeric: tabular-nums; color:var(--text);"></span>
      <div style="flex:1; position:relative; height:28px;">
        <input id="cy-range-from" type="range" min="0" max="0" value="0" step="1" style="position:absolute; width:100%; top:10px; -webkit-appearance:none; background:transparent; pointer-events:none;">
        <input id="cy-range-to"   type="range" min="0" max="0" value="0" step="1" style="position:absolute; width:100%; top:10px; -webkit-appearance:none; background:transparent; pointer-events:none;">
        <div style="position:absolute; top:17px; left:0; right:0; height:4px; background:var(--border); border-radius:2px;"></div>
        <div id="cy-range-fill" style="position:absolute; top:17px; height:4px; background:var(--accent); border-radius:2px;"></div>
      </div>
      <button id="cy-range-reset" style="background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-size:.7rem; cursor:pointer;">Tot</button>
    </div>
    <style>
      #cy-range-wrap input[type=range] { pointer-events:none; }
      #cy-range-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); cursor:pointer; box-shadow:0 0 0 1px var(--accent); }
      #cy-range-wrap input[type=range]::-moz-range-thumb { pointer-events:auto; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); cursor:pointer; }
      #cy-range-wrap input[type=range]::-webkit-slider-runnable-track { background:transparent; height:4px; }
      #cy-range-wrap input[type=range]::-moz-range-track { background:transparent; height:4px; }
    </style>
    <div style="height: 520px;">
      <canvas id="chart-cycling-trend"></canvas>
    </div>
    <div id="cycling-rankings" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:14px;"></div>
  </div>
</section>
<style>
  .rank-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .rank-card h4 { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-weight:600; }
  .rank-card table { width:100%; border-collapse:collapse; font-size:.78rem; }
  .rank-card th { color:var(--muted); font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; font-weight:500; text-align:right; padding:4px 6px; border-bottom:1px solid var(--border); }
  .rank-card th:first-child { text-align:left; }
  .rank-card td { padding:5px 6px; text-align:right; font-variant-numeric: tabular-nums; }
  .rank-card td:first-child { text-align:left; font-weight:600; }
  .rank-card tr:first-child td { color:#f7c94f; }
  .rank-card tr:nth-child(2) td { color:#b8bcca; }
  .rank-card tr:nth-child(3) td { color:#cd7f32; }
  @media (max-width: 900px) { #cycling-rankings { grid-template-columns:1fr; } }
</style>

<main>

  <!-- Summary cards -->
  <div class="cards" id="cards"></div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-box">
      <div class="chart-header">
        <h3 id="dist-chart-title">Distance over time</h3>
        <div class="chart-controls">
          <select id="month-from"></select>
          <span class="sep">→</span>
          <select id="month-to"></select>
          <div class="toggle-group">
            <button class="toggle-btn active" id="btn-dist" onclick="setDistMode('distance')">km</button>
            <button class="toggle-btn" id="btn-hours" onclick="setDistMode('hours')">hours</button>
          </div>
        </div>
      </div>
      <canvas id="chart-distance"></canvas>
    </div>
    <div class="chart-box">
      <h3>Activities by type</h3>
      <canvas id="chart-types"></canvas>
    </div>
  </div>

  <!-- Activity table -->
  <div class="table-panel">
    <div class="table-toolbar">
      <input type="text" id="search" placeholder="Search activities…">
      <select id="filter-type"><option value="">All types</option></select>
      <select id="filter-year"><option value="">All years</option></select>
    </div>
    <div class="table-wrap">
      <table id="activity-table">
        <thead>
          <tr>
            <th data-col="date">Date</th>
            <th data-col="name">Name</th>
            <th data-col="type">Type</th>
            <th data-col="distance_km">Dist (km)</th>
            <th data-col="duration_min">Time</th>
            <th data-col="pace_min_km">Pace</th>
            <th data-col="avg_hr">Avg HR</th>
            <th data-col="elevation_gain">Elev ↑</th>
            <th data-col="avg_power">Avg W</th>
            <th data-col="normalized_power">NP</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Map + detail panel -->
  <div class="map-panel">
    <div class="map-header" id="map-header">
      <strong>Select an activity</strong>
      <span class="meta">Click a row to see the route</span>
    </div>
    <div id="map"></div>
    <div class="map-stats" id="map-stats"></div>
    <div class="map-stats power-profile-strip" id="power-profile" style="display:none;border-top:1px solid var(--border)"></div>
  </div>

</main>

<script>
// ── Data check ────────────────────────────────────────────────────────────────
if (typeof ACTIVITIES === 'undefined' || ACTIVITIES.length === 0) {
  document.querySelector('main').innerHTML = `
    <div class="empty" style="grid-column:1/-1">
      <strong>No data yet</strong>
      Run the parser to generate activity data:<br><br>
      <code>python src/parse_gpx.py</code>
    </div>`;
  throw new Error('No data');
}

// ── State ─────────────────────────────────────────────────────────────────────
let filtered = [...ACTIVITIES];
let sortCol  = 'date';
let sortDir  = -1;           // -1 = desc
let selectedId = null;
let map, routeLayer;

// ── Formatters ────────────────────────────────────────────────────────────────
const fmt = {
  date:     d => d,
  dist:     v => v != null ? v.toFixed(1) + ' km' : '—',
  dur:      v => { if (!v) return '—'; const h = Math.floor(v/60), m = Math.round(v%60); return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m} min`; },
  pace:     v => { if (!v) return '—'; const m = Math.floor(v), s = Math.round((v-m)*60); return `${m}:${String(s).padStart(2,'0')}/km`; },
  hr:       v => v != null ? v + ' bpm' : '—',
  elev:     v => v != null ? v + ' m' : '—',
  power:    v => v != null ? v + ' W' : '—',
};

const BADGE_CLASS = {
  'Running':        'run',
  'Trail Running':  'trail',
  'Cycling':        'bike',
  'Swimming':       'swim',
  'Hiking':         'hike',
  'Walking':        'hike',
  'Strength':       'other',
  'Cardio':         'other',
  'Elliptical':     'other',
  'Yoga':           'other',
  'Gym':            'other',
  'Rowing':         'other',
  'Skiing':         'other',
  'Snowboarding':   'other',
  'Paddleboarding': 'other',
  'Surfing':        'other',
};

function badgeClass(type) {
  return BADGE_CLASS[type] || 'other';
}

// ── Summary cards ─────────────────────────────────────────────────────────────
function renderCards(acts = ACTIVITIES) {
  const total   = acts.length;
  const totalKm = acts.reduce((s, a) => s + (a.distance_km || 0), 0);
  const totalH  = acts.reduce((s, a) => s + (a.duration_min || 0), 0) / 60;
  const totalEl = acts.reduce((s, a) => s + (a.elevation_gain || 0), 0);
  const hrActs  = acts.filter(a => a.avg_hr);
  const avgHR   = hrActs.length ? Math.round(hrActs.reduce((s,a) => s+a.avg_hr, 0) / hrActs.length) : null;
  const isFiltered = acts !== ACTIVITIES;

  const cards = [
    { label: 'Activities',     value: total.toLocaleString(),             sub: isFiltered ? `of ${ACTIVITIES.length.toLocaleString()} total` : 'all time' },
    { label: 'Total distance', value: Math.round(totalKm).toLocaleString() + ' km', sub: (totalKm/40075*100).toFixed(1) + '% of Earth' },
    { label: 'Total time',     value: Math.round(totalH).toLocaleString() + ' h',   sub: Math.round(totalH/24) + ' days' },
    { label: 'Elevation gain', value: Math.round(totalEl/1000) + ' km',   sub: Math.round(totalEl/8849) + '× Everest' },
    ...(avgHR ? [{ label: 'Avg heart rate', value: avgHR + ' bpm', sub: 'across all recorded' }] : []),
  ];

  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>`).join('');

  document.getElementById('header-sub').textContent = isFiltered
    ? `${total} of ${ACTIVITIES.length.toLocaleString()} activities · ${Math.round(totalKm).toLocaleString()} km`
    : `${total} activities · ${Math.round(totalKm).toLocaleString()} km`;
}

// ── Filters ───────────────────────────────────────────────────────────────────
function populateFilters() {
  const types = [...new Set(ACTIVITIES.map(a => a.type))].sort();
  const years = [...new Set(ACTIVITIES.map(a => a.date.slice(0,4)))].sort().reverse();
  const typeEl = document.getElementById('filter-type');
  const yearEl = document.getElementById('filter-year');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; typeEl.appendChild(o); });
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; yearEl.appendChild(o); });
}

function applyFilters() {
  const q    = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('filter-type').value;
  const year = document.getElementById('filter-year').value;
  filtered = ACTIVITIES.filter(a =>
    (!q    || a.name.toLowerCase().includes(q) || a.type.toLowerCase().includes(q)) &&
    (!type || a.type === type) &&
    (!year || a.date.startsWith(year))
  );
  applySort();
  renderCards(filtered);
  renderTable();
  renderCharts();
}

// ── Sorting ───────────────────────────────────────────────────────────────────
function applySort() {
  filtered.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) va = sortDir > 0 ? Infinity : -Infinity;
    if (vb == null) vb = sortDir > 0 ? Infinity : -Infinity;
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
}

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted'));
    th.classList.add('sorted');
    applySort();
    renderTable();
  });
});

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('table-body');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="padding:40px;text-align:center;color:var(--muted)">No activities match the filter</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map((a, i) => `
    <tr data-idx="${i}" class="${a === selectedActivity ? 'selected' : ''}">
      <td>${a.date}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${a.name}</td>
      <td><span class="badge ${badgeClass(a.type)}">${a.type}</span></td>
      <td>${a.distance_km != null ? a.distance_km.toFixed(1) : '—'}</td>
      <td>${fmt.dur(a.duration_min)}</td>
      <td>${fmt.pace(a.pace_min_km)}</td>
      <td>${a.avg_hr != null ? a.avg_hr : '—'}</td>
      <td>${a.elevation_gain != null ? a.elevation_gain + ' m' : '—'}</td>
      <td>${a.avg_power != null ? a.avg_power + ' W' : '—'}</td>
      <td>${a.normalized_power != null ? a.normalized_power + ' W' : '—'}</td>
    </tr>`).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => selectActivity(filtered[+tr.dataset.idx]));
  });
}

// ── Map ───────────────────────────────────────────────────────────────────────
let selectedActivity = null;

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([41.4, 2.17], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 19,
  }).addTo(map);
}

function selectActivity(activity) {
  selectedActivity = activity;

  // Highlight row
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected'));
  const rows = document.querySelectorAll('tbody tr');
  const idx = filtered.indexOf(activity);
  if (idx >= 0 && rows[idx]) rows[idx].classList.add('selected');

  // Map header
  const hdr = document.getElementById('map-header');
  hdr.innerHTML = `<strong>${activity.name}</strong><span class="meta">${activity.date} · <span class="badge ${badgeClass(activity.type)}">${activity.type}</span></span>`;

  // Route
  if (routeLayer) map.removeLayer(routeLayer);
  if (activity.route && activity.route.length > 1) {
    routeLayer = L.polyline(activity.route, { color: '#4f8ef7', weight: 3, opacity: .85 }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
  }

  // Stats strip
  const stats = [
    { label: 'Distance',  value: fmt.dist(activity.distance_km) },
    { label: 'Time',      value: fmt.dur(activity.duration_min) },
    { label: 'Pace',      value: fmt.pace(activity.pace_min_km) },
    { label: 'Avg HR',    value: fmt.hr(activity.avg_hr) },
    { label: 'Elev ↑',   value: fmt.elev(activity.elevation_gain) },
    { label: 'Avg W',     value: fmt.power(activity.avg_power) },
  ].filter(s => s.value !== '—');

  const statsEl = document.getElementById('map-stats');
  statsEl.innerHTML = stats.slice(0, 6).map(s => `
    <div class="map-stat">
      <div class="s-label">${s.label}</div>
      <div class="s-value">${s.value}</div>
    </div>`).join('');

  // Power profile strip (only when power data exists)
  const pwrEl = document.getElementById('power-profile');
  if (activity.normalized_power != null) {
    const pwr = [
      { label: 'NP',    value: activity.normalized_power + ' W' },
      { label: '5 s',   value: activity.max_5s_power    != null ? activity.max_5s_power    + ' W' : '—' },
      { label: '1 min', value: activity.max_1min_power  != null ? activity.max_1min_power  + ' W' : '—' },
      { label: '5 min', value: activity.max_5min_power  != null ? activity.max_5min_power  + ' W' : '—' },
      { label: '20 min',value: activity.max_20min_power != null ? activity.max_20min_power + ' W' : '—' },
    ];
    pwrEl.style.display = 'grid';
    pwrEl.innerHTML = pwr.map(s => `
      <div class="map-stat">
        <div class="s-label">${s.label}</div>
        <div class="s-value">${s.value}</div>
      </div>`).join('');
  } else {
    pwrEl.style.display = 'none';
    pwrEl.innerHTML = '';
  }
}

// ── Charts ────────────────────────────────────────────────────────────────────
let chartDist, chartTypes;

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
};

let distChartMode = 'distance';
let monthFrom = null;
let monthTo   = null;

function populateMonthSelects() {
  const months = [...new Set(ACTIVITIES.map(a => a.date.slice(0, 7)))].sort();
  monthFrom = months[0];
  monthTo   = months[months.length - 1];

  const fmtLabel = m => {
    const [y, mo] = m.split('-');
    return new Date(+y, +mo - 1).toLocaleString('default', { month: 'short', year: '2-digit' });
  };

  const fromEl = document.getElementById('month-from');
  const toEl   = document.getElementById('month-to');
  months.forEach(m => {
    const o1 = new Option(fmtLabel(m), m);
    const o2 = new Option(fmtLabel(m), m);
    fromEl.appendChild(o1);
    toEl.appendChild(o2);
  });
  fromEl.value = monthFrom;
  toEl.value   = monthTo;

  fromEl.addEventListener('change', () => {
    monthFrom = fromEl.value;
    if (monthFrom > monthTo) { monthTo = monthFrom; toEl.value = monthTo; }
    renderCharts();
  });
  toEl.addEventListener('change', () => {
    monthTo = toEl.value;
    if (monthTo < monthFrom) { monthFrom = monthTo; fromEl.value = monthFrom; }
    renderCharts();
  });
}

function setDistMode(mode) {
  distChartMode = mode;
  document.getElementById('btn-dist').classList.toggle('active', mode === 'distance');
  document.getElementById('btn-hours').classList.toggle('active', mode === 'hours');
  document.getElementById('dist-chart-title').textContent =
    mode === 'distance' ? 'Distance over time' : 'Hours over time';
  renderCharts();
}

function buildMonthlyData(acts) {
  const map = {};
  acts.forEach(a => {
    const key = a.date.slice(0, 7);
    if (monthFrom && key < monthFrom) return;
    if (monthTo   && key > monthTo)   return;
    if (!map[key]) map[key] = 0;
    map[key] += distChartMode === 'hours' ? (a.duration_min || 0) / 60 : (a.distance_km || 0);
  });
  const keys = Object.keys(map).sort();
  return {
    labels: keys,
    values: keys.map(k => distChartMode === 'hours' ? +map[k].toFixed(1) : Math.round(map[k])),
  };
}

function buildTypeData(acts) {
  const map = {};
  acts.forEach(a => { map[a.type] = (map[a.type] || 0) + 1; });
  const entries = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0, 6);
  return { labels: entries.map(e=>e[0]), values: entries.map(e=>e[1]) };
}

const TYPE_COLORS = ['#4f8ef7','#4fbd87','#f7c94f','#f74f8e','#9f4ff7','#4ff7f0'];

function renderCharts() {
  const acts = filtered.length ? filtered : ACTIVITIES;

  // Distance over time
  const md = buildMonthlyData(acts);
  if (!chartDist) {
    chartDist = new Chart(document.getElementById('chart-distance'), {
      type: 'bar',
      data: { labels: md.labels, datasets: [{ data: md.values, backgroundColor: 'rgba(79,142,247,.6)', borderRadius: 3 }] },
      options: { ...CHART_DEFAULTS, scales: {
        x: { ticks: { color: '#6b7080', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: '#2a2d3a' } },
        y: { ticks: { color: '#6b7080', font: { size: 10 } }, grid: { color: '#2a2d3a' } },
      }},
    });
  } else {
    chartDist.data.labels = md.labels;
    chartDist.data.datasets[0].data = md.values;
    chartDist.update();
  }

  // Types doughnut
  const td = buildTypeData(acts);
  const total = td.values.reduce((s, v) => s + v, 0);
  if (!chartTypes) {
    chartTypes = new Chart(document.getElementById('chart-types'), {
      type: 'doughnut',
      data: { labels: td.labels, datasets: [{ data: td.values, backgroundColor: TYPE_COLORS, borderWidth: 0 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: 0 },
        onClick(evt, elements) {
          if (!elements.length) {
            // Clicked empty area — clear type filter
            document.getElementById('filter-type').value = '';
          } else {
            const label = chartTypes.data.labels[elements[0].index];
            const sel = document.getElementById('filter-type');
            // Toggle off if already selected
            sel.value = sel.value === label ? '' : label;
          }
          applyFilters();
        },
        plugins: {
          legend: {
            display: true,
            position: 'right',
            onClick(evt, item) {
              // Mirror segment click behaviour in the legend
              const sel = document.getElementById('filter-type');
              const label = chartTypes.data.labels[item.index];
              sel.value = sel.value === label ? '' : label;
              applyFilters();
            },
            labels: {
              color: '#e2e4ed',
              font: { size: 11 },
              boxWidth: 10,
              padding: 10,
              generateLabels(chart) {
                const ds = chart.data.datasets[0];
                const tot = ds.data.reduce((s, v) => s + v, 0);
                const selType = document.getElementById('filter-type').value;
                return chart.data.labels.map((label, i) => ({
                  text: `${label}  ${Math.round(ds.data[i] / tot * 100)}%`,
                  fillStyle: ds.backgroundColor[i],
                  strokeStyle: selType === label ? '#fff' : 'transparent',
                  lineWidth: selType === label ? 2 : 0,
                  fontColor: '#e2e4ed',
                  hidden: false,
                  index: i,
                }));
              },
            },
          },
          tooltip: {
            callbacks: {
              label: ctx => {
                const pct = Math.round(ctx.parsed / total * 100);
                return ` ${ctx.parsed} activities (${pct}%)`;
              },
            },
          },
        },
      },
    });
    // Make cursor a pointer to hint it's clickable
    document.getElementById('chart-types').style.cursor = 'pointer';
  } else {
    chartTypes.data.labels = td.labels;
    chartTypes.data.datasets[0].data = td.values;
    chartTypes.update();
  }
}

// ── Cycling power & HR trend chart ───────────────────────────────────────────
let _cyclingChart = null;
let _cyclingRowsPrepared = null;

function prepareCyclingRows() {
  const raw = (typeof window !== 'undefined' && window.CYCLING_ACTIVITIES) ? window.CYCLING_ACTIVITIES : [];
  const cadMap = (typeof window !== 'undefined' && window.CYCLING_CADENCE) ? window.CYCLING_CADENCE : {};
  return raw.map(r => {
    const date = r.start_time_local ? new Date(r.start_time_local.replace(' ', 'T')) : null;
    const cad = r.activity_id != null ? cadMap[r.activity_id] : null;
    return {
      date,
      power: num(r.avg_power_w) !== null ? num(r.avg_power_w) : num(r.calc_avg_power_w),
      hr: num(r.avg_hr_bpm),
      cadence: num(cad),
      duration_s: num(r.duration_s),
      distance_m: num(r.distance_m),
      elevation_m: num(r.elevation_gain_m),
      type: r.activity_type || 'unknown',
      name: r.activity_name || '',
      activity_id: r.activity_id,
    };
  }).filter(a => a.date && !isNaN(a.date.getTime()));
}

// Hardcoded sanity ranges
const CYCLING_PMIN = 100, CYCLING_PMAX = 500;
const CYCLING_HMIN = 80,  CYCLING_HMAX = 190;
const CYCLING_CMIN = 40,  CYCLING_CMAX = 120;
const CYCLING_MIN_KM = 5;

let _allMonths = null;         // e.g. ['2017-12', ..., '2026-04']
let _rangeFrom = 0;            // index into _allMonths
let _rangeTo = 0;

function initCyclingRangeSlider(source) {
  if (_allMonths) return;
  const keySet = new Set();
  for (const a of source) {
    keySet.add(a.date.getFullYear() + '-' + String(a.date.getMonth()+1).padStart(2,'0'));
  }
  const keys = Array.from(keySet).sort();
  if (!keys.length) return;
  // Fill in gaps so the slider is continuous
  const [fy, fm] = keys[0].split('-').map(Number);
  const [ly, lm] = keys[keys.length-1].split('-').map(Number);
  const months = [];
  const cur = new Date(fy, fm-1, 1), end = new Date(ly, lm-1, 1);
  while (cur <= end) {
    months.push(cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0'));
    cur.setMonth(cur.getMonth()+1);
  }
  _allMonths = months;
  _rangeFrom = 0;
  _rangeTo = months.length - 1;
  const fromEl = document.getElementById('cy-range-from');
  const toEl   = document.getElementById('cy-range-to');
  if (!fromEl || !toEl) return;
  [fromEl, toEl].forEach(el => { el.min = 0; el.max = months.length - 1; });
  fromEl.value = _rangeFrom;
  toEl.value = _rangeTo;
  updateRangeVisual();
  const onInput = (who) => {
    let f = parseInt(fromEl.value, 10);
    let t = parseInt(toEl.value, 10);
    if (f > t) {
      if (who === 'from') fromEl.value = t;
      else toEl.value = f;
    }
    _rangeFrom = parseInt(fromEl.value, 10);
    _rangeTo = parseInt(toEl.value, 10);
    updateRangeVisual();
    renderCyclingTrend();
  };
  fromEl.addEventListener('input', () => onInput('from'));
  toEl.addEventListener('input',   () => onInput('to'));
  const resetBtn = document.getElementById('cy-range-reset');
  if (resetBtn) resetBtn.onclick = () => {
    _rangeFrom = 0; _rangeTo = _allMonths.length - 1;
    fromEl.value = _rangeFrom; toEl.value = _rangeTo;
    updateRangeVisual();
    renderCyclingTrend();
  };
}

function updateRangeVisual() {
  if (!_allMonths) return;
  const lbl = document.getElementById('cy-range-label');
  const fill = document.getElementById('cy-range-fill');
  const fromKey = _allMonths[_rangeFrom], toKey = _allMonths[_rangeTo];
  const fmt = (k) => {
    const [y, m] = k.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleDateString('ca-ES', { month:'short', year:'2-digit' });
  };
  if (lbl) lbl.textContent = `${fmt(fromKey)} → ${fmt(toKey)}`;
  if (fill) {
    const max = _allMonths.length - 1;
    const l = (_rangeFrom / max) * 100;
    const r = (_rangeTo / max) * 100;
    fill.style.left = l + '%';
    fill.style.width = (r - l) + '%';
  }
}

function renderCyclingTrend() {
  try {
    if (_cyclingRowsPrepared === null) _cyclingRowsPrepared = prepareCyclingRows();
    const statsEl = document.getElementById('cycling-stats');
    const canvas = document.getElementById('chart-cycling-trend');
    if (!canvas) { console.warn('canvas chart-cycling-trend not found'); return; }
    const source = _cyclingRowsPrepared || [];
    if (!source.length) { if (statsEl) statsEl.textContent = 'No hi ha dades'; return; }

    const pmin = CYCLING_PMIN, pmax = CYCLING_PMAX;
    const hmin = CYCLING_HMIN, hmax = CYCLING_HMAX;
    const cmin = CYCLING_CMIN, cmax = CYCLING_CMAX;

    // Init the range slider on first render
    initCyclingRangeSlider(source.filter(a =>
      a.distance_m != null && a.distance_m/1000 >= CYCLING_MIN_KM &&
      a.power != null && a.power >= pmin && a.power <= pmax
    ));
    const fromKey = _allMonths ? _allMonths[_rangeFrom] : null;
    const toKey   = _allMonths ? _allMonths[_rangeTo]   : null;
    const inRange = (d) => {
      if (!fromKey || !toKey) return true;
      const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      return k >= fromKey && k <= toKey;
    };

    // Filter by min distance + range (power/HR/cadence clipping applied below)
    const commonFiltered = source
      .filter(a => a.distance_m != null && a.distance_m/1000 >= CYCLING_MIN_KM)
      .filter(a => inRange(a.date))
      .sort((a, b) => a.date - b.date);

    // For scatter/line: apply sanity clipping
    const acts = commonFiltered
      .map(a => ({
        ...a,
        power: (a.power != null && a.power >= pmin && a.power <= pmax) ? a.power : null,
        hr: (a.hr != null && a.hr >= hmin && a.hr <= hmax) ? a.hr : null,
        cadence: (a.cadence != null && a.cadence >= cmin && a.cadence <= cmax) ? a.cadence : null,
      }))
      .filter(a => a.power != null || a.hr != null || a.cadence != null);

    if (!commonFiltered.length) {
      if (statsEl) statsEl.textContent = 'No hi ha activitats amb aquests filtres';
      if (_cyclingChart) { _cyclingChart.destroy(); _cyclingChart = null; }
      return;
    }

    // Build month bucket list starting from the first activity with valid POWER
    // (earlier months have no power-meter data and would show an empty line).
    const firstWithPower = acts.find(a => a.power != null);
    const startDate = firstWithPower ? firstWithPower.date : commonFiltered[0].date;
    const startMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
    const actsFromStart = acts.filter(a => a.date >= startMonth);
    const commonFromStart = commonFiltered.filter(a => a.date >= startMonth);
    const minD = startDate, maxD = commonFiltered[commonFiltered.length-1].date;
    const labels = [];
    const labelIndex = {};
    const cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
    const end = new Date(maxD.getFullYear(), maxD.getMonth(), 1);
    while (cur <= end) {
      const key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0');
      labelIndex[key] = labels.length;
      labels.push(cur.toLocaleDateString('ca-ES', { month:'short', year:'2-digit' }));
      cur.setMonth(cur.getMonth()+1);
    }

    const monthKey = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const powerBuckets = {}, hrBuckets = {}, cadBuckets = {}, kmBuckets = {};
    const powerScatter = [], hrScatter = [], cadScatter = [];
    for (const a of actsFromStart) {
      const k = monthKey(a.date);
      const idx = labelIndex[k];
      const frac = (a.date.getDate()-1) / 31;
      if (a.power != null) {
        (powerBuckets[k] = powerBuckets[k] || []).push(a.power);
        powerScatter.push({ x: idx + frac, y: a.power, name: a.name, activity_id: a.activity_id, date: a.date });
      }
      if (a.hr != null) {
        (hrBuckets[k] = hrBuckets[k] || []).push(a.hr);
        hrScatter.push({ x: idx + frac, y: a.hr, name: a.name, activity_id: a.activity_id, date: a.date });
      }
      if (a.cadence != null) {
        (cadBuckets[k] = cadBuckets[k] || []).push(a.cadence);
        cadScatter.push({ x: idx + frac, y: a.cadence, name: a.name, activity_id: a.activity_id, date: a.date });
      }
    }
    // km and elevation per month uses commonFromStart (not clipped by power/HR)
    // Rodillo/indoor rides have D+ = 0 — exclude from ratio denominator only
    const eleBuckets = {}, kmOutdoorBuckets = {};
    for (const a of commonFromStart) {
      const k = monthKey(a.date);
      if (a.distance_m != null) kmBuckets[k] = (kmBuckets[k] || 0) + a.distance_m / 1000;
      if (a.elevation_m != null && a.elevation_m > 0) {
        eleBuckets[k] = (eleBuckets[k] || 0) + a.elevation_m;
        kmOutdoorBuckets[k] = (kmOutdoorBuckets[k] || 0) + (a.distance_m || 0) / 1000;
      }
    }
    const mean = arr => arr.reduce((s,v) => s+v, 0) / arr.length;
    const byIdx = (buckets, agg) => labels.map((_, i) => {
      const k = Object.keys(labelIndex).find(k => labelIndex[k] === i);
      return buckets[k] ? agg(buckets[k]) : null;
    });
    const powerLine = byIdx(powerBuckets, mean);
    const hrLine = byIdx(hrBuckets, mean);
    const cadLine = byIdx(cadBuckets, mean);
    const kmBars = labels.map((_, i) => {
      const k = Object.keys(labelIndex).find(k => labelIndex[k] === i);
      return {
        x: i+0.5,
        y: kmBuckets[k] || 0,
        ele: eleBuckets[k] || 0,
        kmOutdoor: kmOutdoorBuckets[k] || 0,
      };
    });
    const totalKm = Object.values(kmBuckets).reduce((s,v) => s+v, 0);

    // Linear regression trend line over monthly means
    const trendLine = (arr) => {
      const pts = arr.map((y, i) => (y == null ? null : { x: i+0.5, y })).filter(p => p);
      if (pts.length < 2) return [];
      const n = pts.length;
      const sx = pts.reduce((s,p) => s+p.x, 0);
      const sy = pts.reduce((s,p) => s+p.y, 0);
      const sxy = pts.reduce((s,p) => s+p.x*p.y, 0);
      const sxx = pts.reduce((s,p) => s+p.x*p.x, 0);
      const m = (n*sxy - sx*sy) / (n*sxx - sx*sx);
      const b = (sy - m*sx) / n;
      const x0 = pts[0].x, x1 = pts[pts.length-1].x;
      return [{ x: x0, y: m*x0+b }, { x: x1, y: m*x1+b }];
    };
    const powerTrend = trendLine(powerLine);
    const hrTrend = trendLine(hrLine);
    const cadTrend = trendLine(cadLine);

    if (statsEl) statsEl.textContent = `${commonFiltered.length} activitats · ${Math.round(totalKm).toLocaleString()} km · ${powerScatter.length} pot · ${hrScatter.length} HR · ${cadScatter.length} cad`;

    // Build monthly rankings (km / ele / m-per-km) from commonFiltered
    renderCyclingRankings(commonFiltered);

    if (_cyclingChart) { _cyclingChart.destroy(); _cyclingChart = null; }
    const kmLabelPlugin = {
      id: 'kmLabelPlugin',
      afterDatasetsDraw(chart) {
        const ds = chart.data.datasets.find(d => d.label === 'Km mensuals');
        if (!ds) return;
        const meta = chart.getDatasetMeta(chart.data.datasets.indexOf(ds));
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '600 10px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#4fbd87';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const d = ds.data[i];
          const v = d?.y;
          if (v == null || v < 1) return;
          const ele = d?.ele;
          const kmOut = d?.kmOutdoor || 0;
          ctx.fillStyle = '#4fbd87';
          ctx.fillText(Math.round(v) + ' km', bar.x, bar.y - 26);
          if (ele) {
            ctx.fillStyle = '#6b7080';
            ctx.fillText(Math.round(ele).toLocaleString() + ' m', bar.x, bar.y - 14);
            if (kmOut > 0) {
              ctx.fillStyle = '#8a8f9f';
              ctx.fillText((ele/kmOut).toFixed(0) + ' m/km', bar.x, bar.y - 2);
            }
          }
        });
        ctx.restore();
      }
    };
    _cyclingChart = new Chart(canvas.getContext('2d'), {
      type: 'scatter',
      plugins: [kmLabelPlugin],
      data: {
        labels: labels,
        datasets: [
          { type: 'bar', label: 'Km mensuals', data: kmBars, backgroundColor: 'rgba(79,189,135,0.18)', borderColor: 'rgba(79,189,135,0.35)', borderWidth: 1, yAxisID: 'yKm', order: 10, barPercentage: 0.85, categoryPercentage: 1.0 },
          { label: 'Power (activitat)', data: powerScatter, backgroundColor: 'rgba(79,142,247,0.45)', pointRadius: 3, pointHoverRadius: 6, yAxisID: 'yPower', showLine: false, order: 3, hidden: true },
          { label: 'Power mensual', data: powerLine.map((y, i) => ({ x: i+0.5, y })).filter(p => p.y != null), borderColor: '#4f8ef7', backgroundColor: '#4f8ef7', borderWidth: 2, pointRadius: 4, pointStyle: 'rectRot', showLine: true, spanGaps: true, tension: 0.25, yAxisID: 'yPower', order: 2, hidden: false },
          { label: 'Power tendència', data: powerTrend, borderColor: '#4f8ef7', backgroundColor: 'transparent', borderWidth: 2, borderDash: [6,4], pointRadius: 0, showLine: true, yAxisID: 'yPower', order: 1, hidden: true },
          { label: 'HR (activitat)', data: hrScatter, backgroundColor: 'rgba(247,79,142,0.35)', pointRadius: 3, pointHoverRadius: 6, yAxisID: 'yHr', showLine: false, order: 3, hidden: true },
          { label: 'HR mensual', data: hrLine.map((y, i) => ({ x: i+0.5, y })).filter(p => p.y != null), borderColor: '#f74f8e', backgroundColor: '#f74f8e', borderWidth: 2, pointRadius: 4, pointStyle: 'triangle', showLine: true, spanGaps: true, tension: 0.25, yAxisID: 'yHr', order: 2, hidden: false },
          { label: 'HR tendència', data: hrTrend, borderColor: '#f74f8e', backgroundColor: 'transparent', borderWidth: 2, borderDash: [6,4], pointRadius: 0, showLine: true, yAxisID: 'yHr', order: 1, hidden: true },
          { label: 'Cadence (activitat)', data: cadScatter, backgroundColor: 'rgba(247,201,79,0.40)', pointRadius: 3, pointHoverRadius: 6, yAxisID: 'yCad', showLine: false, order: 3, hidden: true },
          { label: 'Cadence mensual', data: cadLine.map((y, i) => ({ x: i+0.5, y })).filter(p => p.y != null), borderColor: '#f7c94f', backgroundColor: '#f7c94f', borderWidth: 2, pointRadius: 4, pointStyle: 'circle', showLine: true, spanGaps: true, tension: 0.25, yAxisID: 'yCad', order: 2, hidden: false },
          { label: 'Cadence tendència', data: cadTrend, borderColor: '#f7c94f', backgroundColor: 'transparent', borderWidth: 2, borderDash: [6,4], pointRadius: 0, showLine: true, yAxisID: 'yCad', order: 1, hidden: true }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        scales: {
          x: {
            type: 'linear', min: 0, max: labels.length,
            ticks: {
              color: '#6b7080',
              stepSize: 1,
              callback: (v) => { const i = Math.floor(v); return (i >= 0 && i < labels.length) ? labels[i] : ''; }
            },
            grid: { color: '#2a2d3a' }
          },
          yPower: { type: 'linear', position: 'left', title: { display: true, text: 'Power (W)', color: '#4f8ef7' }, ticks: { color: '#4f8ef7' }, grid: { color: '#2a2d3a' } },
          yHr: { type: 'linear', position: 'right', title: { display: true, text: 'HR (bpm)', color: '#f74f8e' }, ticks: { color: '#f74f8e' }, grid: { drawOnChartArea: false } },
          yCad: { type: 'linear', position: 'right', title: { display: true, text: 'Cadence (rpm)', color: '#f7c94f' }, ticks: { color: '#f7c94f' }, grid: { drawOnChartArea: false }, display: 'auto' },
          yKm: { type: 'linear', position: 'right', display: false, beginAtZero: true, suggestedMax: Math.max(400, Math.ceil((Math.max(...Object.values(kmBuckets).concat([0]))||0) * 2.2)), grid: { drawOnChartArea: false } }
        },
        onHover: (event, elements) => {
          const tgt = event?.native?.target;
          if (!tgt) return;
          const clickable = elements.some(el => {
            const p = _cyclingChart.data.datasets[el.datasetIndex].data[el.index];
            return p && p.activity_id;
          });
          tgt.style.cursor = clickable ? 'pointer' : 'default';
        },
        onClick: (event, elements) => {
          if (!elements.length) return;
          const el = elements[0];
          const p = _cyclingChart.data.datasets[el.datasetIndex].data[el.index];
          if (p && p.activity_id) {
            window.open(`https://connect.garmin.com/modern/activity/${p.activity_id}`, '_blank');
          }
        },
        plugins: {
          legend: { labels: { color: '#e2e4ed', boxWidth: 14 } },
          tooltip: {
            callbacks: {
              label: (item) => {
                const d = item.dataset; const p = item.raw;
                if (d.yAxisID === 'yKm') {
                  const km = item.parsed.y;
                  const ele = p && p.ele ? p.ele : 0;
                  const kmOut = p && p.kmOutdoor ? p.kmOutdoor : 0;
                  const ratioStr = (ele && kmOut > 0) ? ' · ' + (ele/kmOut).toFixed(0) + ' m/km' : '';
                  return `${Math.round(km)} km${ele ? ' · D+ ' + Math.round(ele).toLocaleString() + ' m' + ratioStr : ''}`;
                }
                const val = item.parsed.y.toFixed(d.yAxisID === 'yCad' ? 1 : 0);
                const unit = d.yAxisID === 'yPower' ? ' W' : (d.yAxisID === 'yHr' ? ' bpm' : ' rpm');
                const dateStr = p && p.date ? p.date.toLocaleDateString('ca-ES', { day:'numeric', month:'short', year:'numeric' }) : '';
                return `${d.label}: ${val}${unit}${p && p.name ? ' — ' + p.name : ''}${dateStr ? ' (' + dateStr + ')' : ''}`;
              }
            }
          }
        }
      }
    });
  } catch (e) {
    console.warn('renderCyclingTrend failed:', e);
    const statsEl = document.getElementById('cycling-stats');
    if (statsEl) statsEl.textContent = 'Error: ' + (e.message || e);
  }
}

function renderCyclingRankings(rows) {
  const el = document.getElementById('cycling-rankings');
  if (!el) return;
  const monthMap = {};
  for (const a of rows) {
    const k = a.date.getFullYear() + '-' + String(a.date.getMonth()+1).padStart(2,'0');
    if (!monthMap[k]) monthMap[k] = { month: k, km: 0, ele: 0, kmOutdoor: 0, n: 0 };
    monthMap[k].km += (a.distance_m || 0) / 1000;
    monthMap[k].n += 1;
    // Exclude indoor (D+ = 0) from ratio inputs
    if (a.elevation_m != null && a.elevation_m > 0) {
      monthMap[k].ele += a.elevation_m;
      monthMap[k].kmOutdoor += (a.distance_m || 0) / 1000;
    }
  }
  const months = Object.values(monthMap);
  months.forEach(m => { m.ratio = m.kmOutdoor > 0 ? m.ele / m.kmOutdoor : 0; });
  const fmtInt = v => Math.round(v).toLocaleString('ca-ES');
  const fmtMonth = k => {
    const [y, mo] = k.split('-').map(Number);
    return new Date(y, mo-1, 1).toLocaleDateString('ca-ES', { month:'short', year:'numeric' });
  };
  const mk = (title, sorted, cols) => {
    const rows = sorted.slice(0, 3);
    return `<div class="rank-card"><h4>${title}</h4><table>
      <thead><tr><th>Mes</th>${cols.map(c => `<th>${c.h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${fmtMonth(r.month)}</td>${cols.map(c => `<td>${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  };
  const topKm = [...months].sort((a,b) => b.km - a.km);
  const topEle = [...months].sort((a,b) => b.ele - a.ele);
  const topRatio = months.filter(m => m.n >= 3).sort((a,b) => b.ratio - a.ratio);
  el.innerHTML = [
    mk('🚴 Top km', topKm, [
      { h: 'Km',   f: r => fmtInt(r.km) },
      { h: 'D+',   f: r => fmtInt(r.ele) },
      { h: 'm/km', f: r => r.ratio.toFixed(1) },
    ]),
    mk('⛰️ Top D+', topEle, [
      { h: 'D+',   f: r => fmtInt(r.ele) },
      { h: 'Km',   f: r => fmtInt(r.km) },
      { h: 'm/km', f: r => r.ratio.toFixed(1) },
    ]),
    mk('📐 Top m/km', topRatio, [
      { h: 'm/km', f: r => r.ratio.toFixed(1) },
      { h: 'Km',   f: r => fmtInt(r.km) },
      { h: 'D+',   f: r => fmtInt(r.ele) },
    ]),
  ].join('');
}

function num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  const headers = splitCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const cells = splitCsvLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i]);
    return obj;
  });
}
function splitCsvLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else {
      if (c === ',') { out.push(cur); cur = ''; }
      else if (c === '"') inQ = true;
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function monthlyMean(points) {
  const buckets = {};
  for (const p of points) {
    const k = p.x.getFullYear() + '-' + String(p.x.getMonth()+1).padStart(2,'0');
    (buckets[k] = buckets[k] || []).push(p.y);
  }
  return Object.keys(buckets).sort().map(k => {
    const [y, m] = k.split('-').map(Number);
    const vals = buckets[k];
    const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
    return { x: new Date(y, m-1, 15), y: mean };
  });
}

renderCyclingTrend();
